name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # A throwaway SQL Server for the integration tests. The password only protects this
    # container, which lives for the length of the job and is not reachable from outside.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-only-Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-only-Passw0rd!' -Q 'select 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      WEBCRM_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci-only-Passw0rd!;TrustServerCertificate=True"
      WEBCRM_TEST_REQUIRE_SQLSERVER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: |
          set -o pipefail
          dotnet test --no-build 2>&1 | tee test.log

      # The job log needs a sign-in to read; annotations do not. So list the failed tests (with the first lines of
      # their messages) as an annotation, which shows on the run page and through the API.
      - name: Report failed tests
        if: failure()
        run: |
          if [ -f test.log ]; then
            msg=$(grep -E -A3 '^[[:space:]]*failed ' test.log | head -80 | sed 's/%/%25/g' | tr '\n' '|' | cut -c1-3800)
            echo "::error title=Failed tests::${msg:-none matched}"
            tail -n 60 test.log | sed 's/%/%25/g' | tr '\n' '|' | cut -c1-3800 | { read -r tailmsg; echo "::error title=End of test log::${tailmsg}"; }
          else
            echo "::error title=Failed tests::test.log was not written"
          fi

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore
